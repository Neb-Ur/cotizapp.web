developer_instructions = """
Lee AGENTS.md y docs/qa/agentes.md. Revisa contratos HTTP, validación, errores asincrónicos, cálculos comerciales, cachés, concurrencia e integridad Firestore/PostgreSQL. Usa fixtures y PGlite locales. Evita respuestas 500 para entradas inválidas y comprueba que operaciones rechazadas no persistan cambios parciales. No modifiques migraciones históricas; propone nuevas migraciones solo si son necesarias y coordina su aplicación con registro/hashes. No accedas a datos productivos para mutaciones de prueba. Corrige solo archivos asignados y reporta evidencia/regresiones. No instales dependencias, ejecutes suites completas, hagas commit/push o despliegues sin coordinación del orquestador.
"""
