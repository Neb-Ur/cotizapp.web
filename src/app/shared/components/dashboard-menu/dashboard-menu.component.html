<button
  type="button"
  class="mobile-overlay"
  *ngIf="isMobileViewport && isMobileOpen"
  (click)="closeMenu()"
  tabindex="-1"
  aria-label="Cerrar menu"
></button>

<aside
  id="dashboard-navigation"
  class="sidebar"
  tabindex="-1"
  [appModalSurface]="isMobileViewport && isMobileOpen"
  (surfaceClosed)="closeMenu()"
  [attr.role]="isMobileViewport ? 'dialog' : null"
  [attr.aria-modal]="isMobileViewport && isMobileOpen ? 'true' : null"
  [attr.aria-hidden]="isMobileViewport && !isMobileOpen ? 'true' : null"
  [attr.inert]="isMobileViewport && !isMobileOpen ? '' : null"
  [attr.aria-label]="title"
  [class.mobile-drawer]="isMobileViewport"
  [class.mobile-open]="isMobileViewport && isMobileOpen"
>
  <div class="panel-chip">Panel operativo</div>

  <div class="sidebar-head">
    <div class="sidebar-title-group">
      <div class="user-avatar">{{ userName ? userName[0] : 'U' }}</div>
      <div>
        <h2>{{ title }}</h2>
        <p class="user">{{ userName }}</p>
      </div>
    </div>
    <button
      class="sidebar-close"
      *ngIf="isMobileViewport"
      type="button"
      (click)="closeMenu()"
      aria-label="Cerrar menu"
    >
      ×
    </button>
  </div>

  <nav aria-label="Secciones del panel">
    <button
      *ngFor="let section of sections"
      type="button"
      [class.active]="activeSection === section.id"
      [attr.aria-current]="activeSection === section.id ? 'page' : null"
      (click)="selectSection(section.id)"
    >
      {{ section.label }}
    </button>
  </nav>

  <div class="sidebar-actions">
    <button
      *ngIf="extraActionLabel"
      type="button"
      [class]="extraActionClass"
      (click)="triggerExtraAction()"
    >
      {{ extraActionLabel }}
    </button>
    <a routerLink="/cuenta/cambiar-contrasena" (click)="closeMenu()">Cambiar contraseña</a>
    <a routerLink="/" (click)="closeMenu()">Ir al sitio</a>
    <button type="button" (click)="logout()">Cerrar sesión</button>
  </div>
</aside>
