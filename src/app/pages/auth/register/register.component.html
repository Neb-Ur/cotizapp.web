<main class="register-page">
  <section class="auth-card auth-card--wide">
    <a routerLink="/" class="back-link">&larr; Volver al inicio</a>
    <div class="auth-header">
      <div class="role-pill">Cuenta de maestro</div>
      <h1>Crea tu cuenta</h1>
      <p>Guarda tus cotizaciones y consulta tu historial de proyectos.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form auth-form--grid" [attr.aria-busy]="isSubmitting">
      <div class="field">
        <label for="register-name">Nombre y apellido</label>
        <input id="register-name" formControlName="name" type="text" autocomplete="name" [attr.aria-invalid]="hasError('name')" aria-describedby="register-name-error" />
        <small id="register-name-error" *ngIf="hasError('name')">Ingresa un nombre válido.</small>
      </div>

      <div class="field">
        <label for="register-email">Email</label>
        <input id="register-email" formControlName="email" type="email" placeholder="correo@dominio.com" autocomplete="email" [attr.aria-invalid]="hasError('email')" aria-describedby="register-email-error" />
        <small id="register-email-error" *ngIf="hasError('email')">Ingresa un correo válido.</small>
      </div>

      <div class="field">
        <label for="register-password">Contraseña</label>
        <input id="register-password" formControlName="password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" [attr.aria-invalid]="hasError('password')" aria-describedby="register-password-error" />
        <small id="register-password-error" *ngIf="hasError('password')">Mínimo 6 caracteres.</small>
      </div>

      <div class="field">
        <label for="register-phone">Teléfono</label>
        <input id="register-phone" formControlName="phone" type="tel" placeholder="+56 9 ..." autocomplete="tel" [attr.aria-invalid]="hasError('phone')" aria-describedby="register-phone-error" />
        <small id="register-phone-error" *ngIf="hasError('phone')">Ingresa un teléfono válido.</small>
      </div>

      <div class="field">
        <label for="register-commune">Comuna</label>
        <input id="register-commune" formControlName="commune" type="text" placeholder="Ej: La Florida" autocomplete="address-level2" [attr.aria-invalid]="hasError('commune')" aria-describedby="register-commune-error" />
        <small id="register-commune-error" *ngIf="hasError('commune')">Ingresa tu comuna.</small>
      </div>

      <div class="field--full form-actions">
        <button class="btn btn-dark btn-full" type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Creando cuenta...' : 'Crear cuenta' }}
        </button>
        <p class="form-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
      </div>
    </form>
    <p class="auth-switch">¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a></p>
  </section>
</main>
