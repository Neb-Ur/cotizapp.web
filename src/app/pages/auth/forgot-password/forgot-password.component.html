<main class="auth-page">
  <section class="auth-card">
    <a routerLink="/login" class="back">← Volver a iniciar sesión</a>
    <h1>Recuperar contraseña</h1>
    <p>Te enviaremos instrucciones para restablecer tu acceso.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Email
        <input type="email" formControlName="email" placeholder="correo@dominio.com" />
        <small *ngIf="hasError()">Ingresa un correo válido.</small>
      </label>

      <button class="btn btn-primary" type="submit" [disabled]="isSubmitting">{{ isSubmitting ? 'Enviando...' : 'Enviar instrucciones' }}</button>
    </form>

    <p class="success" *ngIf="sent">Te enviamos un correo para restablecer tu contraseña.</p>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </section>
</main>
