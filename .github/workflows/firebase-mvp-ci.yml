name: CotizApp CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: Qué quieres ejecutar sobre main
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish

permissions:
  contents: read

concurrency:
  group: cotizapp-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  FUNCTIONS_NODE_VERSION: '22'
  FIREBASE_PROJECT_ID: cotizapp-d71c8
  PRODUCTION_URL: https://cotizapp-d71c8.web.app

jobs:
  ci:
    name: Test + build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Run frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build Angular production bundle
        run: npm run build

      - name: Setup Node for Functions
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FUNCTIONS_NODE_VERSION }}

      - name: Install Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund

      - name: Test Firebase Functions contracts
        run: npm --prefix functions test

      - name: Upload validated web build
        uses: actions/upload-artifact@v4
        with:
          name: cotizapp-web-${{ github.sha }}
          path: dist/cotizacion-web/browser
          if-no-files-found: error
          retention-days: 7

      - name: Pipeline summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CotizApp pipeline"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "- Requested action: ${{ inputs.action }}"
            else
              echo "- Requested action: validate"
            fi
            echo "- Push behavior: validate + deploy to QA"
            echo "- QA deploy: automatic on push to main; manual publish also available"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Firebase production
    if: >-
      needs.ci.result == 'success' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
      )
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://cotizapp-d71c8.web.app

    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_COTIZAPP_D71C8 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Node for Functions
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FUNCTIONS_NODE_VERSION }}

      - name: Install Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund

      - name: Download validated web build
        uses: actions/download-artifact@v4
        with:
          name: cotizapp-web-${{ github.sha }}
          path: dist/cotizacion-web/browser

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::error::Falta configurar FIREBASE_SERVICE_ACCOUNT_JSON o FIREBASE_SERVICE_ACCOUNT_COTIZAPP_D71C8 en GitHub Actions secrets."
            exit 1
          fi

          CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS"
          chmod 600 "$CREDENTIALS"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS" >> "$GITHUB_ENV"
          echo "FIREBASE_AUTH_MODE=adc" >> "$GITHUB_ENV"
          echo "Firebase authentication: service account / ADC"

      - name: Deploy Firebase application
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[seed-firestore]') }}" == "true" ]]; then
            echo "Seed-only push: skipping Firebase deploy; proceeding directly to Auth + Firestore data seed."
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[hosting-only]') }}" == "true" ]]; then
            DEPLOY_TARGETS="hosting"
            echo "Hosting-only push: deploying only Hosting."
          elif [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[firestore-deploy]') }}" == "true" ]]; then
            DEPLOY_TARGETS="functions,hosting,firestore:rules,firestore:indexes"
            echo "Firestore-deploy push: deploying application plus Firestore rules and indexes."
          else
            DEPLOY_TARGETS="functions,hosting"
            echo "Standard push: deploying Functions and Hosting. Firestore rules/indexes are unchanged."
          fi

          npx --yes firebase-tools@latest deploy             --only "$DEPLOY_TARGETS"             --project "$FIREBASE_PROJECT_ID"             --non-interactive

      - name: Create Firebase Auth demo users and seed Firestore
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[seed-firestore]')
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${FIREBASE_AUTH_MODE}" != "adc" ]]; then
            echo "::error::La carga de Firestore requiere credenciales ADC."
            exit 1
          fi

          DEMO_PASSWORD=123456 node functions/scripts/seed-firestore.mjs

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking $PRODUCTION_URL"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$PRODUCTION_URL/" > /tmp/cotizapp-index.html
          grep -q "<app-root" /tmp/cotizapp-index.html

          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$PRODUCTION_URL/__/firebase/init.json" > /tmp/firebase-init.json
          grep -q '"projectId"' /tmp/firebase-init.json

          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$PRODUCTION_URL/api/busqueda" > /tmp/cotizapp-api.json
          grep -q '"ok":true' /tmp/cotizapp-api.json

          echo "Hosting, Firebase bootstrap and API are responding correctly."

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CotizApp production"
            echo "- URL: $PRODUCTION_URL"
            echo "- Firebase project: $FIREBASE_PROJECT_ID"
            echo "- Commit: ${GITHUB_SHA:0:7}"
            echo "- Trigger: push to main or manual publish"
          } >> "$GITHUB_STEP_SUMMARY"
