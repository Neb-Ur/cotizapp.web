name: CotizApp CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: Qué quieres ejecutar sobre main
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish

permissions:
  contents: read

concurrency:
  group: cotizapp-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  FUNCTIONS_NODE_VERSION: '22'
  FIREBASE_PROJECT_ID: cotizapp-d71c8
  PRODUCTION_URL: https://cotizapp-d71c8.web.app

jobs:
  ci:
    name: Test + build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Run frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build Angular production bundle
        run: npm run build

      - name: Setup Node for Functions
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FUNCTIONS_NODE_VERSION }}

      - name: Install Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund

      - name: Build Firebase Functions
        run: npm run functions:build

      - name: Upload validated web build
        uses: actions/upload-artifact@v4
        with:
          name: cotizapp-web-${{ github.sha }}
          path: dist/cotizacion-web/browser
          if-no-files-found: error
          retention-days: 7

      - name: Pipeline summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CotizApp pipeline"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "- Requested action: ${{ inputs.action }}"
            else
              echo "- Requested action: validate"
            fi
            echo "- Push behavior: validate + deploy to QA"
            echo "- QA deploy: automatic on push to main; manual publish also available"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Firebase production
    if: >-
      needs.ci.result == 'success' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
      )
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://cotizapp-d71c8.web.app

    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_COTIZAPP_D71C8 }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Node for Functions
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.FUNCTIONS_NODE_VERSION }}

      - name: Install Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund

      - name: Download validated web build
        uses: actions/download-artifact@v4
        with:
          name: cotizapp-web-${{ github.sha }}
          path: dist/cotizacion-web/browser

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS"
            chmod 600 "$CREDENTIALS"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=adc" >> "$GITHUB_ENV"
            echo "Firebase authentication: service account / ADC"
          elif [[ -n "${FIREBASE_TOKEN:-}" ]]; then
            CREDENTIALS="$RUNNER_TEMP/firebase-user-adc.json"
            CREDENTIALS="$CREDENTIALS" node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          writeFileSync(process.env.CREDENTIALS, JSON.stringify({
            type: 'authorized_user',
            client_id: '563584335869-fgrhgmd47bqnekij5i8b5pr03ho849e6.apps.googleusercontent.com',
            client_secret: 'j9iVZfS8kkCEFUPaAeJV0sAi',
            refresh_token: process.env.FIREBASE_TOKEN,
            quota_project_id: process.env.FIREBASE_PROJECT_ID
          }));
          NODE
            chmod 600 "$CREDENTIALS"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
            echo "Firebase authentication: CI token exposed as temporary ADC"
          else
            echo "::error::Falta configurar FIREBASE_SERVICE_ACCOUNT_JSON, FIREBASE_SERVICE_ACCOUNT_COTIZACION_77802 o FIREBASE_TOKEN en GitHub Actions secrets."
            exit 1
          fi

      - name: Deploy Hosting, Functions and Firestore
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[seed-firestore]') }}" == "true" ]]; then
            echo "Seed-only push: skipping Firebase deploy; proceeding directly to Auth + Firestore data seed."
            exit 0
          fi

          DEPLOY_TARGETS="hosting,functions,firestore:rules,firestore:indexes"

          if [[ "$FIREBASE_AUTH_MODE" == "token" ]]; then
            npx --yes firebase-tools@latest deploy               --only "$DEPLOY_TARGETS"               --project "$FIREBASE_PROJECT_ID"               --token "$FIREBASE_TOKEN"               --non-interactive
          else
            npx --yes firebase-tools@latest deploy               --only "$DEPLOY_TARGETS"               --project "$FIREBASE_PROJECT_ID"               --non-interactive
          fi

      - name: Create Firebase Auth demo users and seed Firestore
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[seed-firestore]')
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${FIREBASE_AUTH_MODE}" != "adc" && "${FIREBASE_AUTH_MODE}" != "token" ]]; then
            echo "::error::La carga de Firestore requiere credenciales ADC."
            exit 1
          fi

          (
            cd functions
            node --input-type=module <<'NODE'
          import { GoogleAuth } from 'google-auth-library';

          const projectId = process.env.FIREBASE_PROJECT_ID;
          const googleAuth = new GoogleAuth({
            scopes: ['https://www.googleapis.com/auth/cloud-platform']
          });
          const client = await googleAuth.getClient();
          const safeError = (error, action) => {
            const status = error?.response?.status || 'unknown';
            const message = error?.response?.data?.error?.message || error?.message || 'unknown error';
            return new Error(`${action} (${status}): ${message}`);
          };

          try {
            await client.request({
              url: `https://identitytoolkit.googleapis.com/v2/projects/${projectId}/identityPlatform:initializeAuth`,
              method: 'POST',
              headers: { 'X-Goog-User-Project': projectId },
              data: {}
            });
            console.log('Firebase Authentication initialized.');
          } catch (error) {
            if (error?.response?.status !== 409) throw safeError(error, 'Unable to initialize Firebase Authentication');
            console.log('Firebase Authentication was already initialized.');
          }

          try {
            await client.request({
              url: `https://identitytoolkit.googleapis.com/admin/v2/projects/${projectId}/config?updateMask=signIn.email.enabled,signIn.email.passwordRequired`,
              method: 'PATCH',
              headers: { 'X-Goog-User-Project': projectId },
              data: {
                signIn: {
                  email: {
                    enabled: true,
                    passwordRequired: true
                  }
                }
              }
            });
          } catch (error) {
            throw safeError(error, 'Unable to enable Email/Password authentication');
          }
          console.log('Firebase Email/Password authentication enabled.');
          NODE
          )

          DEMO_PASSWORD=123456 node functions/scripts/seed-firestore.mjs

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking $PRODUCTION_URL"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$PRODUCTION_URL/" > /tmp/cotizapp-index.html
          grep -q "<app-root" /tmp/cotizapp-index.html

          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$PRODUCTION_URL/__/firebase/init.json" > /tmp/firebase-init.json
          grep -q '"projectId"' /tmp/firebase-init.json

          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$PRODUCTION_URL/api/busqueda" > /tmp/cotizapp-api.json
          grep -q '"ok":true' /tmp/cotizapp-api.json

          echo "Hosting, Firebase bootstrap and API are responding correctly."

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CotizApp production"
            echo "- URL: $PRODUCTION_URL"
            echo "- Firebase project: $FIREBASE_PROJECT_ID"
            echo "- Commit: ${GITHUB_SHA:0:7}"
            echo "- Trigger: push to main or manual publish"
          } >> "$GITHUB_STEP_SUMMARY"
